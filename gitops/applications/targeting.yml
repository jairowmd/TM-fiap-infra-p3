apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: targeting-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/jairowmd/TM-fiap-infra-p3.git
    targetRevision: main
    path: gitops/k8s/targeting-service

  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true