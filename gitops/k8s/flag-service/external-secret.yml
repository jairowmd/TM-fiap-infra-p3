apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: flag-secret
  namespace: togglemaster

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: flag-secret
    creationPolicy: Owner

  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: tm-fiap-p4/dev/data-services
      property: FLAG_DATABASE_URL