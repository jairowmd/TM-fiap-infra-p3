apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default
  destination:
    namespace: observability
    server: https://kubernetes.default.svc

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "92.18.0"
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/gitops/observability/kube-prometheus-stack/values.yaml

    - repoURL: https://github.com/jairowmd/TM-fiap-infra-p3.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus Operator CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true
