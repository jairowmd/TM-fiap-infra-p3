name: CI / DevSecOps

# Dispara em pushes e pull‑requests na branch main (adicione outras branches se quiser)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Variáveis de ambiente comuns a todos os jobs
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  GO_VERSION: "1.24"

jobs:
  # -----------------------------------------------------------------
  # 1️⃣ Build & unit‑test (executa para cada serviço)
  # -----------------------------------------------------------------
  build-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: analytics
            ecr_repo: analytics-service
          - service: auth
            ecr_repo: auth-service
          - service: evaluation
            ecr_repo: evaluation-service
          - service: flag
            ecr_repo: flag-service
          - service: targeting
            ecr_repo: targeting-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Unit Tests
        run: go test -v -race -cover ./...

  # -----------------------------------------------------------------
  # 2️⃣ Lint (golangci‑lint)
  # -----------------------------------------------------------------
  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        include:
          - service: analytics
            ecr_repo: analytics-service
          - service: auth
            ecr_repo: auth-service
          - service: evaluation
            ecr_repo: evaluation-service
          - service: flag
            ecr_repo: flag-service
          - service: targeting
            ecr_repo: targeting-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: golangci‑lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/${{ matrix.service }}

  # -----------------------------------------------------------------
  # 3️⃣ SAST (gosec)
  # -----------------------------------------------------------------
  sast:
    name: SAST (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          - service: analytics
            ecr_repo: analytics-service
          - service: auth
            ecr_repo: auth-service
          - service: evaluation
            ecr_repo: evaluation-service
          - service: flag
            ecr_repo: flag-service
          - service: targeting
            ecr_repo: targeting-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...

  # -----------------------------------------------------------------
  # 4️⃣ SCA (Trivy filesystem scan)
  # -----------------------------------------------------------------
  sca:
    name: SCA (Trivy FS) (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: sast
    strategy:
      matrix:
        include:
          - service: analytics
            ecr_repo: analytics-service
          - service: auth
            ecr_repo: auth-service
          - service: evaluation
            ecr_repo: evaluation-service
          - service: flag
            ecr_repo: flag-service
          - service: targeting
            ecr_repo: targeting-service
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: services/${{ matrix.service }}
          severity: CRITICAL
          exit-code: "1"
          format: table

  # -----------------------------------------------------------------
  # 5️⃣ Docker build / Trivy image scan / Push to ECR
  # -----------------------------------------------------------------
  docker:
    name: Docker Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: sca
    # Só executa quando o push for para a branch main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: analytics
            ecr_repo: analytics-service
          - service: auth
            ecr_repo: auth-service
          - service: evaluation
            ecr_repo: evaluation-service
          - service: flag
            ecr_repo: flag-service
          - service: targeting
            ecr_repo: targeting-service
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.ecr_repo }}:$IMAGE_TAG services/${{ matrix.service }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ matrix.ecr_repo }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          format: table

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/${{ matrix.ecr_repo }}:$IMAGE_TAG
