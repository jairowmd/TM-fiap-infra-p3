deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: s3
    bucketNames:
      chunks: "tm-fiap-p4-dev-loki-chunks-9572"
      ruler: "tm-fiap-p4-dev-loki-ruler-9572"
    s3:
      region: "us-east-2"
      s3ForcePathStyle: false

  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 30d

  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: s3
    delete_request_cancel_period: 24h


chunksCache:
  enabled: true
  allocatedMemory: 512
  allocatedCPU: 100m


resultsCache:
  enabled: true
  allocatedMemory: 256
  allocatedCPU: 50m

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "gp3"

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

minio:
  enabled: false

serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::443670030001:role/tm-fiap-p4-dev-loki"