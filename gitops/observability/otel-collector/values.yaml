# Compatible with opentelemetry-collector chart 0.175.1.
mode: daemonset
fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.161.0"
command:
  name: otelcol-contrib

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

presets:
  logsCollection:
    enabled: true

  kubernetesAttributes:
    enabled: true

serviceAccount:
  create: true
  automountServiceAccountToken: true

# In daemonset mode the chart only creates the Service when explicitly enabled.
# Without it the apps cannot reach otel-collector.observability.svc:4317/4318.
# The chart sets internalTrafficPolicy: Local, so each pod talks to its node's agent.
service:
  enabled: true
  type: ClusterIP

# License key (INGEST - LICENSE) do New Relic, criada pelo ExternalSecret
# gitops/observability/otel-collector/manifests/newrelic-external-secret.yaml.
# optional: sem a secret o Collector sobe mesmo assim (Loki e Prometheus seguem
# funcionando); só o envio ao New Relic é recusado.
extraEnvs:
  - name: NEW_RELIC_LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: newrelic-license
        key: NEW_RELIC_LICENSE_KEY
        optional: true

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: null
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: null
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false

config:
  receivers:
    # Remove the chart's default receivers outside the initial OTLP scope.
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
          cors:
            allowed_origins:
              - http://*
              - https://*

  processors:
    k8sattributes:
      auth_type: serviceAccount
      extract:
        metadata:
          - k8s.pod.name
          - k8s.namespace.name
          - k8s.container.name
          - k8s.deployment.name
    memory_limiter:
      check_interval: 1s
      limit_mib: 192
      spike_limit_mib: 48
      limit_percentage: null
      spike_limit_percentage: null
    batch:
      timeout: 5s
      send_batch_size: 512
      send_batch_max_size: 1024
    # Só na pipeline do New Relic, que trabalha melhor com métricas delta.
    # O Prometheus continua recebendo as métricas cumulativas originais.
    cumulativetodelta: {}

  exporters:
    otlphttp/loki:
      endpoint: "http://loki:3100/otlp"
      tls:
        insecure: true  
    # Prometheus native OTLP receiver (enableOTLPReceiver in kube-prometheus-stack).
    # The exporter appends /v1/metrics -> /api/v1/otlp/v1/metrics.
    otlphttp/prometheus:
      endpoint: "http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/otlp"
      tls:
        insecure: true
    # APM: traces e métricas dos 5 microsserviços para o New Relic (conta US).
    # Conta na região EU: trocar por https://otlp.eu01.nr-data.net
    otlphttp/newrelic:
      endpoint: https://otlp.nr-data.net
      headers:
        api-key: ${env:NEW_RELIC_LICENSE_KEY}
      compression: gzip
    # Temporary diagnostic output, not persistent telemetry storage.
    
    debug:
      verbosity: detailed

  extensions:
    # Required by the chart's readiness and liveness probes.
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/newrelic]
      metrics:
        receivers: [otlp]
        processors: [k8sattributes, memory_limiter, batch]
        exporters: [otlphttp/prometheus]
      # Cópia das mesmas métricas para o New Relic (APM), em delta.
      metrics/newrelic:
        receivers: [otlp]
        processors: [k8sattributes, memory_limiter, cumulativetodelta, batch]
        exporters: [otlphttp/newrelic]
      logs:
        processors: [k8sattributes, memory_limiter, batch]
        exporters: [otlphttp/loki]
