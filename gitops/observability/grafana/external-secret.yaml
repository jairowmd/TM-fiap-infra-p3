apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: grafana-admin

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"

  data:
    - secretKey: password
      remoteRef:
        key: tm-fiap-p4/dev/data-services
        property: GRAFANA_ADMIN_PASSWORD
---
# Token do GitHub usado pelo contact point de Self-Healing (alerting/self-healing.yaml).
# Vira a variável GITHUB_DISPATCH_TOKEN do Grafana (kube-prometheus-stack/values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: grafana-self-healing

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-self-healing
    creationPolicy: Owner

  data:
    - secretKey: github-dispatch-token
      remoteRef:
        key: tm-fiap-p4/dev/data-services
        property: GITHUB_DISPATCH_TOKEN

---
# Credenciais de notificações do Grafana: PagerDuty e Slack.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: grafana-notifications

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-notifications
    creationPolicy: Owner

  data:
    - secretKey: pagerduty-integration-key
      remoteRef:
        key: tm-fiap-p4/dev/data-services
        property: PAGERDUTY_INTEGRATION_KEY

    - secretKey: slack-webhook-url
      remoteRef:
        key: tm-fiap-p4/dev/data-services
        property: SLACK_WEBHOOK_URL