apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-config
  namespace: togglemaster
data:
  AUTH_SERVICE_URL: "http://auth-service:8001"
  FLAG_SERVICE_URL: "http://flag-service:8002"
  TARGETING_SERVICE_URL: "http://targeting-service:8003"
  EVALUATION_SERVICE_URL: "http://evaluation-service:8004"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8005"
  AUTH_PORT: "8001"
  FLAG_PORT: "8002"
  TARGETING_PORT: "8003"
  EVALUATION_PORT: "8004"
  ANALYTICS_PORT: "8005"
  AWS_REGION: "us-east-2"
  DYNAMODB_TABLE: "ToggleMasterAnalytics"
  # OpenTelemetry: todos os serviços enviam traces/métricas ao OTel Collector,
  # que encaminha para o New Relic (APM).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=togglemaster,deployment.environment=dev"
