apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd

spec:
  project: default
  destination:
    namespace: observability
    server: https://kubernetes.default.svc

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: "6.30.1"
      helm:
        valueFiles:
          - $values/gitops/observability/loki/values.yaml

    - repoURL: https://github.com/jairowmd/TM-fiap-infra-p3.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
