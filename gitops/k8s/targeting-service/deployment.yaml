apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
  labels:
    app: targeting-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
        - name: targeting-service
          image: 786197525471.dkr.ecr.us-east-2.amazonaws.com/tm-fiap-p4-dev-targeting:be7d60c09ad7b333be02ea247db199ee07f1123b
          ports:
            - containerPort: 8003
          env:
            # --- OpenTelemetry (APM / tracing distribuído) ---
            - name: OTEL_SERVICE_NAME
              value: "targeting-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: OTEL_EXPORTER_OTLP_PROTOCOL
            - name: OTEL_RESOURCE_ATTRIBUTES
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: OTEL_RESOURCE_ATTRIBUTES
            - name: OTEL_PYTHON_FLASK_EXCLUDED_URLS
              value: "health"
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: TARGETING_PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AUTH_SERVICE_URL
          envFrom:
            - secretRef:
                name: targeting-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 20
