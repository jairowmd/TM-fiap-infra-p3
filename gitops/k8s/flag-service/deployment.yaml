apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster
  labels:
    app: flag-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: 786197525471.dkr.ecr.us-east-2.amazonaws.com/tm-fiap-p4-dev-flag:141c2d997a50983f332eadd4d06ae81f20477615
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
            # --- OpenTelemetry (APM / tracing distribuído) ---
            - name: OTEL_SERVICE_NAME
              value: "flag-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: OTEL_EXPORTER_OTLP_PROTOCOL
            - name: OTEL_RESOURCE_ATTRIBUTES
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: OTEL_RESOURCE_ATTRIBUTES
            - name: OTEL_PYTHON_FLASK_EXCLUDED_URLS
              value: "health"
            # Semconv HTTP estável: http.server.request.duration (segundos), a mesma
            # métrica dos serviços Go, usada no dashboard e no alerta de 5xx.
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "http"
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: FLAG_PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AUTH_SERVICE_URL
          envFrom:
            - secretRef:
                name: flag-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 20
