apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: evaluation-secret
  namespace: togglemaster

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: evaluation-secret
    creationPolicy: Owner

  data:
  - secretKey: REDIS_URL
    remoteRef:
        key: tm-fiap-p3/dev/data-services
        property: REDIS_URL

  - secretKey: AWS_SQS_URL
    remoteRef:
      key: tm-fiap-p3/dev/data-services
      property: AWS_SQS_URL