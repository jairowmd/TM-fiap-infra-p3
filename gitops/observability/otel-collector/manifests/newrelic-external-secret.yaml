# License key do New Relic usada pelo OTel Collector para exportar traces e
# métricas. O valor fica no AWS Secrets Manager (secret criada pelo Terraform
# em terraform/observability-secrets.tf; o valor é preenchido manualmente).
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: newrelic-license
  namespace: observability

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: newrelic-license
    creationPolicy: Owner

  data:
    - secretKey: NEW_RELIC_LICENSE_KEY
      remoteRef:
        key: tm-fiap-p4/dev/observability
        property: NEW_RELIC_LICENSE_KEY
