name: CI / DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  GO_VERSION: "1.24.13"
  PYTHON_VERSION: "3.9"

  ECR_PREFIX: tm-fiap-p3-dev

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            path: services/auth
            language: go

          - service: evaluation
            path: services/evaluation
            language: go

          - service: flag
            path: services/flag
            language: python

          - service: targeting
            path: services/targeting
            language: python

          - service: analytics
            path: services/analytics
            language: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Go
      # ------------------------------------------------------------

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.path }}/go.mod

      - name: Resolve Go dependencies
        if: matrix.language == 'go'
        working-directory: ${{ matrix.path }}
        run: go mod tidy

      - name: Build Go service
        if: matrix.language == 'go'
        working-directory: ${{ matrix.path }}
        run: go build -v ./...

      - name: Test Go service
        if: matrix.language == 'go'
        working-directory: ${{ matrix.path }}
        run: go test -v -race -cover ./...

      - name: Vet Go service
        if: matrix.language == 'go'
        working-directory: ${{ matrix.path }}
        run: go vet ./...

      - name: Lint Go service
        if: matrix.language == 'go'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: ${{ matrix.path }}

      - name: Install gosec
        if: matrix.language == 'go'
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0

      - name: Run gosec
        if: matrix.language == 'go'
        working-directory: ${{ matrix.path }}
        run: gosec ./...

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt

      - name: Install Python dependencies
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.5 ruff==0.11.13 bandit==1.8.3

      - name: Validate Python source
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: python -m compileall .

      - name: Run Python tests
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest -v
          else
            echo "::warning::No Python unit tests found for ${{ matrix.service }}"
          fi

      - name: Lint Python service
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: ruff check .

      - name: Run Bandit
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: bandit -r .

      # ------------------------------------------------------------
      # SCA
      # ------------------------------------------------------------

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.path }}
          severity: CRITICAL
          exit-code: "1"
          format: table

      # ------------------------------------------------------------
      # Docker
      # ------------------------------------------------------------

      - name: Build Docker image
        env:
          IMAGE_NAME: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --pull --no-cache \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            "${{ matrix.path }}"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          format: table

      # ------------------------------------------------------------
      # OIDC Inspection
      # ------------------------------------------------------------
      - name: Inspect OIDC claims
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(JSON.stringify({
              sub: claims.sub,
              aud: claims.aud,
              repository: claims.repository,
              ref: claims.ref
            }, null, 2));  

      # ------------------------------------------------------------
      # AWS / ECR
      # Publish on pushes and manual runs targeting main
      # ------------------------------------------------------------

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ECR_REPOSITORY="${ECR_PREFIX}-${{ matrix.service }}"
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          # BatchGetImage is already granted to the existing CI role.
          RESPONSE=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" --output json)
          if jq -e '.images | length > 0' <<< "$RESPONSE" >/dev/null; then
            echo "Image already exists: $IMAGE"
          elif jq -e '.failures | length == 1 and .[0].failureCode == "ImageNotFound"' \
              <<< "$RESPONSE" >/dev/null; then
            docker tag "${{ matrix.service }}:$IMAGE_TAG" "$IMAGE"
            docker push "$IMAGE"
          else
            echo "$RESPONSE" >&2
            exit 1
          fi

  promote:
    name: Update GitOps image tags
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Update tags and commit
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$IMAGE_TAG" ]]; then
            echo "Main has advanced; skipping tags from this older run."
            exit 0
          fi

          for service in auth flag targeting evaluation analytics; do
            manifest="gitops/k8s/${service}-service/deployment.yaml"
            mapfile -t images < <(awk '$1 == "image:" {print $2}' "$manifest")
            if [[ "${#images[@]}" -ne 1 ]]; then
              echo "Expected one container image in $manifest" >&2
              exit 1
            fi

            # Preserve the repository; replace an existing tag or digest.
            repository="${images[0]%@*}"
            if [[ "${repository##*/}" == *:* ]]; then
              repository="${repository%:*}"
            fi
            if [[ ! "$repository" =~ ^[a-zA-Z0-9./:_-]+$ ]]; then
              echo "Unsupported image reference in $manifest" >&2
              exit 1
            fi
            sed -i -E "s|^([[:blank:]]*image:[[:blank:]]*).*|\1$repository:$IMAGE_TAG|" "$manifest"
            git add "$manifest"
          done

          if git diff --cached --quiet; then
            echo "Image tags are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(gitops): update image tags to $IMAGE_TAG"
          # Reject concurrent changes instead of overwriting main.
          git push origin HEAD:main
