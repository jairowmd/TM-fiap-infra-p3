apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: grafana-admin

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"

  data:
    - secretKey: password
      remoteRef:
        key: tm-fiap-p4/dev/data-services
        property: GRAFANA_ADMIN_PASSWORD
